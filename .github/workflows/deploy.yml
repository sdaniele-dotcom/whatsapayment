name: Deploy What's a Payment to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Served at the root of the custom domain (whatsapayment.com), so no
      # path prefix. If you ever serve this from the github.io/<repo> URL
      # instead, set BASE_PATH to /<repo> here.
      #
      # There are no secrets to pass: the site is static marketing pages and
      # a calculator that runs entirely in the browser. It talks to no
      # database and holds no keys.
      - run: npm run build
        env:
          BASE_PATH: ""
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
