name: Deploy What's a Payment to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # The Instagram feed is baked in at build time, so the site has to rebuild
  # to pick up new posts. 11:17 UTC is early morning Pacific, and off the hour
  # because GitHub's scheduler is busiest exactly on it.
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Served at the root of the custom domain (whatsapayment.com), so no
      # path prefix. If you ever serve this from the github.io/<repo> URL
      # instead, set BASE_PATH to /<repo> here.
      #
      #
      # The two Instagram values are the only secrets here, and they are read
      # by scripts/fetch-instagram.mjs on the runner — never shipped to the
      # browser. With neither set the script writes an empty feed and the
      # social page renders without its grid, so the site still deploys. A
      # lapsed token must not be able to take the website down with it.
      - run: npm run build
        env:
          BASE_PATH: ""
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
